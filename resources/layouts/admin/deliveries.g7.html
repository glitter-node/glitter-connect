<layout name="deliveries" version="1.0.0" extends="_admin_base">
  <meta title="$t:glitter-connect.admin.deliveries.title"/>
  <data-source id="deliveries" type="api" endpoint="/api/modules/glitter-connect/admin/deliveries" method="GET" :auto_fetch="true" :auth_required="true"/>
  <slot name="content"><div class="admin-page-content-responsive-fluid glitter-connect-shell"><page-header data-type="composite" title="$t:glitter-connect.admin.deliveries.title" description="$t:glitter-connect.admin.deliveries.description"/><include src="partials/_navigation.g7.html"/><section class="admin-card"><div data-each="item in {{deliveries?.data?.data ?? []}}" class="glitter-connect-data-row"><strong>#{{item.id}}</strong><span>{{item.status}}</span><span>{{item.response_code ?? '$t:glitter-connect.common.not_available'}}</span><span>{{item.attempt_count}}</span><span>{{item.last_error ?? ''}}</span><time>{{item.next_attempt_at ?? item.delivered_at ?? item.updated_at}}</time><button type="button" data-glitter-connect-action data-endpoint="/admin/deliveries/{{item.id}}/replay">$t:glitter-connect.admin.deliveries.replay</button></div><empty-state data-type="composite" data-if="{{(deliveries?.data?.data ?? []).length === 0}}" iconName="paper-plane" title="$t:glitter-connect.common.empty" description="$t:glitter-connect.admin.deliveries.empty_description"/></section></div></slot>
</layout>
