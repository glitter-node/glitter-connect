<layout name="subscriptions" version="1.0.0" extends="_admin_base">
  <meta title="$t:glitter-connect.admin.subscriptions.title"/>
  <data-source id="subscriptions" type="api" endpoint="/api/modules/glitter-connect/admin/subscriptions" method="GET" :auto_fetch="true" :auth_required="true"/>
  <slot name="content"><div class="admin-page-content-responsive-fluid glitter-connect-shell"><page-header data-type="composite" title="$t:glitter-connect.admin.subscriptions.title" description="$t:glitter-connect.admin.subscriptions.description"/><include src="partials/_navigation.g7.html"/><section class="admin-card"><h2 class="section-heading">$t:glitter-connect.admin.subscriptions.create</h2><form data-glitter-connect-form data-endpoint="/admin/subscriptions" class="glitter-connect-form"><label><span>$t:glitter-connect.admin.subscriptions.connection_id</span><input name="connection_id" type="number" min="1" required/></label><label><span>$t:glitter-connect.admin.subscriptions.event_type</span><input name="event_type" required maxlength="160"/></label><label><span>$t:glitter-connect.admin.subscriptions.target_url</span><input name="target_url" type="url" required maxlength="2048"/></label><label><span>$t:glitter-connect.admin.subscriptions.outbound_signature_version</span><select name="outbound_signature_version" value="v1" data-outbound-signature-version data-current-version="v1" required><option value="v1">$t:glitter-connect.admin.subscriptions.signature_v1</option><option value="v0">$t:glitter-connect.admin.subscriptions.signature_v0</option></select></label><p>$t:glitter-connect.admin.subscriptions.signature_version_help</p><output data-outbound-signature-warning aria-live="polite"></output><button type="submit">$t:glitter-connect.common.create</button><output aria-live="polite"></output></form></section><section class="admin-card"><div data-each="item in {{subscriptions?.data?.data ?? []}}" class="glitter-connect-data-row"><strong>{{item.event_type}}</strong><span>{{item.target_url}}</span><span>{{item.status}}</span><span>{{$t('glitter-connect.admin.subscriptions.signature_' + item.outbound_signature_version)}}</span><form data-glitter-connect-form data-method="PATCH" data-endpoint="/admin/subscriptions/{{item.id}}" class="glitter-connect-inline-form"><label><span>$t:glitter-connect.admin.subscriptions.outbound_signature_version</span><select name="outbound_signature_version" value="{{item.outbound_signature_version}}" data-outbound-signature-version data-current-version="{{item.outbound_signature_version}}" required><option value="v1">$t:glitter-connect.admin.subscriptions.signature_v1</option><option value="v0">$t:glitter-connect.admin.subscriptions.signature_v0</option></select></label><output data-outbound-signature-warning aria-live="polite"></output><button type="submit">$t:glitter-connect.admin.subscriptions.update_signature_version</button><output aria-live="polite"></output></form><button type="button" data-glitter-connect-action data-method="PATCH" data-endpoint="/admin/subscriptions/{{item.id}}">$t:glitter-connect.common.manage</button></div><empty-state data-type="composite" data-if="{{(subscriptions?.data?.data ?? []).length === 0}}" iconName="plug" title="$t:glitter-connect.common.empty" description="$t:glitter-connect.admin.subscriptions.empty_description"/></section></div></slot>
</layout>
