<layout name="connections" version="1.0.0" extends="_admin_base">
  <meta title="$t:glitter-connect.admin.connections.title"/>
  <data-source id="connections" type="api" endpoint="/api/modules/glitter-connect/admin/connections" method="GET" :auto_fetch="true" :auth_required="true"/>
  <slot name="content"><div class="admin-page-content-responsive-fluid glitter-connect-shell" data-glitter-connect="connections"><page-header data-type="composite" title="$t:glitter-connect.admin.connections.title" description="$t:glitter-connect.admin.connections.description"/><include src="partials/_navigation.g7.html"/><section class="admin-card"><h2 class="section-heading">$t:glitter-connect.admin.connections.create</h2><form data-glitter-connect-form data-endpoint="/admin/connections" class="glitter-connect-form"><label><span>$t:glitter-connect.admin.connections.name</span><input name="name" required maxlength="120"/></label><label><span>$t:glitter-connect.admin.connections.provider</span><input name="provider" value="generic" maxlength="80"/></label><label><span>$t:glitter-connect.admin.connections.signature_required</span><select name="signature_required" data-glitter-signature-required required><option value="1" selected>$t:glitter-connect.admin.connections.signature_required_option</option><option value="0">$t:glitter-connect.admin.connections.signature_optional_option</option></select></label><p>$t:glitter-connect.admin.connections.signature_policy_help</p><label><span>$t:glitter-connect.admin.connections.secret</span><input name="secret" type="password" autocomplete="new-password" required/></label><button type="submit">$t:glitter-connect.common.create</button><output aria-live="polite"></output></form></section><section class="admin-card"><div data-each="item in {{connections?.data?.data ?? []}}" class="glitter-connect-data-row"><strong>{{item.name}}</strong><span>{{item.provider}}</span><span>{{item.status}}</span><span>{{$t('glitter-connect.admin.connections.' + (item.signature_required ? 'required_status' : 'optional_status'))}}</span><form data-glitter-connect-form data-method="PATCH" data-endpoint="/admin/connections/{{item.id}}" class="glitter-connect-inline-form"><label><span>$t:glitter-connect.admin.connections.name</span><input name="name" value="{{item.name}}" required maxlength="120"/></label><button type="submit">$t:glitter-connect.admin.connections.update</button><output aria-live="polite"></output></form><button type="button" data-glitter-connect-action data-method="PATCH" data-endpoint="/admin/connections/{{item.id}}">{{$t('glitter-connect.common.' + (item.status === 'active' ? 'deactivate' : 'activate'))}}</button><button type="button" data-glitter-connect-action data-endpoint="/admin/connections/{{item.id}}/test">$t:glitter-connect.admin.connections.test</button><button type="button" data-glitter-connect-action data-endpoint="/admin/connections/{{item.id}}/rotate-secret">$t:glitter-connect.admin.connections.rotate_secret</button><output aria-live="polite"></output></div><empty-state data-type="composite" data-if="{{(connections?.data?.data ?? []).length === 0}}" iconName="plug" title="$t:glitter-connect.common.empty" description="$t:glitter-connect.admin.connections.empty_description"/></section></div></slot>
</layout>
