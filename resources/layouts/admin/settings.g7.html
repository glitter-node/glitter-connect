<layout name="settings" version="1.0.0" extends="_admin_base">
  <meta title="$t:glitter-connect.admin.settings.title"/>
  <data-source id="settings" type="api" endpoint="/api/modules/glitter-connect/admin/settings" method="GET" :auto_fetch="true" :auth_required="true"/>
  <slot name="content"><div class="admin-page-content-responsive-fluid glitter-connect-shell"><page-header data-type="composite" title="$t:glitter-connect.admin.settings.title" description="$t:glitter-connect.admin.settings.description"/><include src="partials/_navigation.g7.html"/><section class="admin-card"><form data-glitter-connect-form data-method="PUT" data-endpoint="/admin/settings" class="glitter-connect-form"><label><span>$t:glitter-connect.admin.settings.retention</span><input name="retention_days" type="number" min="1" max="3650" value="{{settings?.data?.retention_days ?? 90}}" required/></label><label><span>$t:glitter-connect.admin.settings.max_attempts</span><input name="max_attempts" type="number" min="1" max="30" value="{{settings?.data?.max_attempts ?? 12}}" required/></label><button type="submit">$t:glitter-connect.common.save</button><output aria-live="polite"></output></form></section></div></slot>
</layout>
